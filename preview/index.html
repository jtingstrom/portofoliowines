<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PortoFolioWines</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@300;400;500;600&display=swap');
  .rv-app { --ink:#1C1512; --paper:#FFFFFF; --brass:#8C7A4E; --wine:#A41519; --wine-light:#C41E23; font-family:'Work Sans', sans-serif; }
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@300;400;500;600&display=swap');
  .rv-app button { font-family: inherit; cursor: pointer; }
  .rv-eyebrow { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--brass); font-weight: 500; }
  .rv-h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 500; margin: 0; }
  .rv-body.small { font-size: 0.9rem; color: #4a3f35; }
  .rv-brand { display: flex; align-items: center; gap: 0.5rem; padding: 0; border: none; background: none; }
  .rv-logo-img { height: 34px; width: auto; display: block; }
  .rv-logo-img.small { height: 24px; }
  .rv-logo-img.big { height: 78px; }
  .rv-logo-img.large { height: 64px; margin: 0 auto; }
  .rv-btn { padding: 0.85rem 1.6rem; font-size: 0.9rem; letter-spacing: 0.03em; border-radius: 2px; border: none; }
  .rv-btn.primary { background: var(--wine); color: var(--paper); }
  .rv-btn.primary:hover { background: var(--wine-light); }
  .rv-btn.ghost { border: 1px solid var(--ink); background: none; color: var(--ink); }
  .rv-btn.ghost:hover { background: var(--ink); color: var(--paper); }
  .rv-gate { position: fixed; inset: 0; background: var(--ink); display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .rv-gate-card { background: var(--paper); max-width: 420px; width: 100%; padding: 2.6rem 2.2rem; border-radius: 4px; text-align: center; }
  .rv-gate-lang { display: flex; justify-content: center; gap: 0.4rem; margin-bottom: 1.4rem; }
  .rv-gate-actions { display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1.8rem; }
  .rv-gate-actions .rv-btn { width: 100%; }
  .rv-lang-btn { font-size: 0.72rem; letter-spacing: 0.05em; padding: 0.3rem 0.6rem; border: 1px solid #E3E1DD; border-radius: 2px; color: #8a7c6e; background: transparent; }
  .rv-lang-btn.active { background: var(--wine); color: var(--paper); border-color: var(--wine); }
        .rv-app { --paper-alt: #F5F5F4; --line: #E3E1DD; --olive: #4B7335; background: var(--paper); color: var(--ink); min-height: 100vh; line-height: 1.5; }
        .rv-app * { box-sizing: border-box; }

        .rv-h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 5vw, 3rem); font-weight: 500; line-height: 1.1; margin: 0 0 1rem 0; }
        .rv-h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 600; margin: 0.4rem 0; }
        .rv-body { font-size: 0.98rem; color: #3a3028; max-width: 60ch; margin: 0.8rem 0; }

        /* NAV */
        .rv-nav {
          display: flex; flex-direction: column; align-items: center; gap: 0.9rem;
          padding: 1.6rem 4vw 1.1rem; border-bottom: 1px solid var(--line);
          position: sticky; top: 0; background: rgba(255,255,255,0.96);
          backdrop-filter: blur(6px); z-index: 50;
        }
        .rv-nav .rv-lang-switch { position: absolute; top: 0.9rem; right: 4vw; }
        .rv-nav-bottom { display: flex; align-items: center; justify-content: center; gap: 2rem; flex-wrap: wrap; width: 100%; }
        .rv-nav-links { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; }
        .rv-nav-link {
          font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase;
          padding: 0.55rem 1.2rem; border-radius: 999px; border: 1px solid transparent;
          color: #6b5d50; transition: background .18s ease, color .18s ease, border-color .18s ease;
        }
        .rv-nav-link:hover { background: var(--paper-alt); color: var(--wine); border-color: var(--line); }
        .rv-nav-link.active { background: var(--wine); color: var(--paper); border-color: var(--wine); }
        .rv-lang-switch { display: flex; gap: 0.3rem; }

        /* HERO */
        .rv-hero { padding: 5rem 4vw 3rem; max-width: 1180px; }
        .rv-hero-grid { display: grid; grid-template-columns: 0.65fr 1.35fr; gap: 3.5rem; align-items: start; }
        @media (max-width: 760px) { .rv-hero-grid { grid-template-columns: 1fr; gap: 1.6rem; } }
        .rv-hero-left { text-align: center; }
        .rv-hero-left .rv-vine { margin-left: auto; margin-right: auto; }
        .rv-hero-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.4rem, 5.5vw, 3.6rem); font-weight: 500; line-height: 1.05; margin: 0 0 1.2rem 0; }
        .rv-hero-title em { color: var(--wine); font-style: italic; }
        .rv-vine { margin: 0.6rem 0 1.4rem 0; display: block; }
        .rv-vine-path { stroke-dasharray: 320; stroke-dashoffset: 320; animation: rv-draw-vine 1.4s ease forwards; }
        .rv-vine-dot { opacity: 0; animation: rv-fade-dot .6s ease forwards; }
        @keyframes rv-draw-vine { to { stroke-dashoffset: 0; } }
        @keyframes rv-fade-dot { to { opacity: 1; } }
        .rv-hero-sub { font-size: 1rem; color: #4a3f35; margin: 0 0 1.6rem 0; line-height: 1.65; }
        .rv-hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; }

        /* SECTIONS */
        .rv-section { padding: 3rem 4vw; border-top: 1px solid var(--line); }
        .rv-section-head { margin-bottom: 2rem; }
        .page-head { padding: 3.5rem 4vw 1.5rem; border-top: none; }

        .rv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.4rem; padding: 0 4vw 3rem; }
        .rv-section > .rv-grid { padding: 0; }
        .rv-section > .rv-producer-list { padding: 0; }
        .rv-grid.articles { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

        .rv-philosophy { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; }
        @media (max-width: 760px) { .rv-philosophy { grid-template-columns: 1fr; } }
        .rv-value { margin-bottom: 1.4rem; }

        /* WINE CARD */
        .rv-card {
          text-align: left; border: 1px solid var(--line); background: var(--paper-alt);
          padding: 1.2rem; border-radius: 3px; transition: transform .18s ease, box-shadow .18s ease;
          display: flex; flex-direction: column; gap: 0.15rem;
        }
        .rv-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(28,21,18,0.08); }
        .rv-card-image { display: flex; justify-content: center; padding: 0.4rem 0 0.8rem; }
        .rv-bottle { height: 130px; width: auto; filter: drop-shadow(0 8px 10px rgba(28,21,18,0.12)); }
        .rv-bottle.large { height: 210px; }
        .rv-modal-image { display: flex; justify-content: center; padding: 0.5rem 0 1rem; }
        .rv-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.6rem; }
        .rv-card-price { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 600; color: var(--wine); }
        .rv-card-name { font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; font-weight: 600; margin: 0; }
        .rv-card-producer { font-size: 0.85rem; color: #6b5d50; margin: 0; }
        .rv-card-origin { font-size: 0.8rem; color: var(--brass); margin: 0.3rem 0 0 0; }
        .rv-card-grape { font-size: 0.78rem; color: #8a7c6e; margin: 0; }

        .rv-seal {
          width: 52px; height: 52px; border-radius: 50%; display: flex; flex-direction: column;
          align-items: center; justify-content: center; color: var(--paper); flex-shrink: 0;
          box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25);
        }
        .rv-seal-year { font-family: 'Cormorant Garamond', serif; font-size: 0.85rem; font-weight: 700; line-height: 1; }
        .rv-seal-type { font-size: 0.5rem; letter-spacing: 0.04em; text-transform: uppercase; margin-top: 2px; }

        /* ARTICLE CARD */
        .rv-article-card {
          text-align: left; padding: 1.5rem 1.6rem; border: 1px solid var(--line); background: var(--paper-alt);
          border-radius: 8px; display: flex; flex-direction: column; gap: 0.5rem;
          transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        .rv-article-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(28,21,18,0.08); border-color: var(--wine); }
        .rv-article-card .rv-h3 { margin: 0; }
        .rv-article-badge {
          align-self: flex-start; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase;
          padding: 0.35rem 0.9rem; border-radius: 999px; background: var(--wine); color: var(--paper);
        }
        .rv-article-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 0.4rem; }
        .rv-article-time { font-size: 0.75rem; color: #8a7c6e; }
        .rv-article-card:first-child { border-top: none; }
        .rv-read-more { font-size: 0.82rem; color: var(--wine); margin-top: 0.5rem; }
        .rv-article-detail { padding: 3rem 4vw 5rem; max-width: 68ch; }
        .rv-back { font-size: 0.85rem; color: var(--brass); margin-bottom: 1.4rem; }

        .rv-empty { padding: 2rem 4vw; color: #8a7c6e; }

        /* MODAL */
        .rv-modal-backdrop {
          position: fixed; inset: 0; background: rgba(28,21,18,0.55);
          display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 100;
        }
        .rv-modal {
          background: var(--paper); max-width: 520px; width: 100%; max-height: 88vh; overflow-y: auto;
          padding: 2.2rem; border-radius: 4px; position: relative;
        }
        .rv-modal-close { position: absolute; top: 1rem; right: 1.2rem; font-size: 1.6rem; color: #8a7c6e; line-height: 1; }
        .rv-modal-head { display: flex; gap: 1rem; align-items: flex-start; margin-bottom: 0.5rem; }
        .rv-modal-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin: 1.2rem 0; }
        .rv-modal-facts div, .rv-contact-grid div, .rv-modal-pairing { display: flex; flex-direction: column; gap: 0.15rem; }
        .rv-fact-label { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass); }
        .rv-modal-pairing { margin: 1rem 0; }
        .rv-modal-pairing p { margin: 0; font-size: 0.92rem; }
        .rv-modal-footer { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 1rem; margin-top: 0.5rem; }
        .rv-modal-price { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 600; color: var(--wine); }
        .rv-modal-note { font-size: 0.75rem; color: #8a7c6e; }

        /* CONTACT */
        .rv-contact { background: var(--paper-alt); }
        .rv-contact-grid { display: flex; gap: 3rem; flex-wrap: wrap; margin-top: 1.5rem; font-size: 0.92rem; }

        /* FOOTER */
        .rv-footer {
          padding: 2.5rem 4vw; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap;
          gap: 1.5rem; align-items: center; justify-content: space-between; background: var(--paper);
        }
        .rv-footer > div:first-child { display: flex; align-items: center; gap: 0.5rem; }
        .rv-footer-links { display: flex; gap: 1.4rem; }
        .rv-footer-links button { font-size: 0.85rem; color: #6b5d50; }
        .rv-footer-links button:hover { color: var(--wine); }
        .rv-footer-contact { width: 100%; display: flex; gap: 1.4rem; flex-wrap: wrap; font-size: 0.78rem; color: #6b5d50; border-top: 1px solid var(--line); padding-top: 1rem; margin-top: 0.3rem; }
        .rv-footer-note { width: 100%; font-size: 0.72rem; color: #a89a8c; margin-top: 0.5rem; }

        .rv-producer-list { display: flex; flex-direction: column; gap: 1rem; padding: 0 4vw 3rem; }
        .rv-producer-block { border: 1px solid var(--line); background: var(--paper-alt); padding: 1.4rem 1.6rem; border-radius: 3px; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; transition: transform .18s ease, box-shadow .18s ease; }
        .rv-producer-block:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(28,21,18,0.08); }
        .rv-producer-block .rv-card-name { margin: 0; }

        .rv-productlist { padding: 0 4vw 4rem; display: flex; flex-direction: column; gap: 3rem; }
        .rv-product-category { max-width: 980px; }
        .rv-price-category-title { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; margin: 0 0 0.6rem 0; letter-spacing: 0.01em; }
        .rv-product-card { cursor: default; }
        .rv-product-type { display: inline-block; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass); border: 1px solid var(--line); border-radius: 12px; padding: 0.2rem 0.6rem; margin-bottom: 0.6rem; align-self: flex-start; }
        .rv-product-image { width: 100%; display: flex; justify-content: center; margin-bottom: 0.8rem; }
        .rv-product-image img { height: 190px; width: auto; object-fit: contain; }
        .rv-pdf-link { display: inline-block; margin-top: 0.7rem; font-size: 0.8rem; color: var(--wine); border-top: 1px solid var(--line); padding-top: 0.7rem; }
        .rv-pdf-link:hover { text-decoration: underline; }

</style>

      en: ["Portugal has grown wine for over two thousand years, and its wine regions stretch from the damp, green Minho in the north to the dry, sun-baked Alentejo in the south. Despite its small size, the country is home to more than 250 native grape varieties — one of the highest concentrations in the world — largely thanks to geographic isolation and a long tradition of field blends that preserved old grapes long abandoned elsewhere.",
        "The Douro Valley is perhaps best known for port wine, but increasingly produces excellent dry reds and whites too. Further north, the cooler, Atlantic-influenced climate of the Vinho Verde region yields fresh, light wines, while the sun-drenched Alentejo in the south produces full-bodied, fruity reds. Between these extremes lie regions like Dão, Bairrada and Setúbal, each with its own distinct character.",

      pt: ["Portugal cultiva vinha há mais de dois mil anos, e as suas regiões vinícolas estendem-se do húmido e verde Minho, a norte, ao seco e soalheiro Alentejo, a sul. Apesar do seu pequeno território, o país alberga mais de 250 castas nativas — uma das concentrações mais altas do mundo — em grande parte graças ao isolamento geográfico e a uma longa tradição de vinhas de encosto que preservou castas antigas há muito desaparecidas noutros lugares.",
        "O Vale do Douro é talvez mais conhecido pelo vinho do Porto, mas produz cada vez mais tintos e brancos secos de grande qualidade. Mais a norte, o clima mais fresco e influenciado pelo Atlântico da região dos Vinhos Verdes dá origem a vinhos frescos e leves, enquanto o soalheiro Alentejo, a sul, produz tintos encorpados e frutados. Entre estes extremos encontram-se regiões como o Dão, a Bairrada e Setúbal, cada uma com o seu carácter próprio.",
        "O que torna Portugal único é precisamente esta diversidade de castas locais que quase não se cultivam em mais lado nenhum — Touriga Nacional, Alvarinho, Baga, Encruzado — castas que dão aos vinhos uma identidade própria e clara, em vez de imitarem estilos internacionais. É exatamente essa identidade que, na PortoFolioWines, queremos trazer para a Suécia."],

  { id: 2, category: { sv: "Druvor", en: "Grapes", pt: "Castas" }, readTime: 6,

    body: {
      sv: ["Touriga Nacional räknas som Portugals mest ädla röda druva och är en av huvudingredienserna i både portvin och allt fler torra rödviner från Douro och Dão. Den ger djupt färgade, kraftfulla viner med arom av mörka bär, violer och en tydlig tanninstruktur som gör att de åldras väl.",
        "Bland de vita druvorna är Alvarinho den mest kända — ursprungligen från Minho-regionen i nordvästra Portugal, med hög syra och toner av citrus och stenfrukt. Loureiro, som ofta blandas med Alvarinho i Vinho Verde, bidrar med blommighet och en lättare, mer aromatisk karaktär. Längre söderut ger Encruzado i Dão-regionen fylligare, mer strukturerade viner som ofta jämförs med Chardonnay.",
        "Baga är kanske den mest säregna av dem alla: en tunnskalig, sent mognande druva från Bairrada-regionen som ger viner med hög syra och stram struktur — älskad av samlare men krävande att odla. Och i Favaios och Douro-dalen, där vår egen Moscatel Galego kommer ifrån, ger druvan allt från friska, torra viner till de djupt koncentrerade starkviner som blir kvar i fatet i decennier."],
      en: ["Touriga Nacional is considered Portugal's most noble red grape and a key ingredient in both port and an increasing number of dry reds from the Douro and Dão. It produces deeply coloured, powerful wines with aromas of dark berries and violets, and a firm tannin structure that ages well.",
        "Among the white grapes, Alvarinho is the best known — originally from the Minho region in northwestern Portugal, with high acidity and notes of citrus and stone fruit. Loureiro, often blended with Alvarinho in Vinho Verde, brings floral character and a lighter, more aromatic style. Further south, Encruzado in the Dão region produces fuller, more structured whites often compared to Chardonnay.",
        "Baga is perhaps the most distinctive of them all: a thin-skinned, late-ripening grape from the Bairrada region that yields high-acid, tightly structured wines — beloved by collectors but demanding to grow. And in Favaios and the Douro Valley, where our own Moscatel Galego comes from, the grape produces everything from fresh, dry wines to the deeply concentrated fortified wines left to age in cask for decades."],
      pt: ["A Touriga Nacional é considerada a casta tinta mais nobre de Portugal e um ingrediente-chave tanto no vinho do Porto como num número crescente de tintos secos do Douro e do Dão. Produz vinhos de cor profunda e grande estrutura, com aromas a frutos escuros e violetas, e taninos firmes que envelhecem bem.",
        "Entre as castas brancas, a Alvarinho é a mais conhecida — originária da região do Minho, no noroeste de Portugal, com acidez elevada e notas de citrinos e fruta de caroço. A Loureiro, frequentemente misturada com Alvarinho nos Vinhos Verdes, traz carácter floral e um estilo mais leve e aromático. Mais a sul, a Encruzado, no Dão, dá origem a brancos mais encorpados e estruturados, muitas vezes comparados ao Chardonnay.",
        "A Baga é talvez a mais singular de todas: uma casta de casca fina e maturação tardia da região da Bairrada, que produz vinhos de acidez elevada e estrutura tensa — adorada por colecionadores, mas exigente de cultivar. E em Favaios e no Vale do Douro, de onde vem a nossa Moscatel Galego, a casta dá origem a tudo, desde vinhos frescos e secos até aos generosos profundamente concentrados que ficam anos a envelhecer em casco."],

  { id: 3, category: { sv: "Region", en: "Region", pt: "Região" }, readTime: 4,
    title: { sv: "Vinho Verde – ung, frisk och missförstådd", en: "Vinho Verde – young, fresh, and misunderstood", pt: "Vinho Verde – jovem, fresco e incompreendido" },
    excerpt: { sv: "Namnet betyder inte \u201dgrönt vin\u201d på det sätt du tror. Vi reder ut myterna om Portugals friskaste region.", en: "The name doesn't mean 'green wine' the way you'd think. We clear up the myths about Portugal's freshest region.", pt: "O nome não significa \u201dvinho verde\u201d da forma que imagina. Desfazemos os mitos sobre a região mais fresca de Portugal." },
    body: {
      sv: ["Vinho Verde är namnet på både en region och dess vin, i den fuktiga, gröna nordvästra hörnet av Portugal mellan floderna Minho och Douro. Namnet syftar inte på färgen utan på vinets ungdom — det är tänkt att drickas ungt och friskt, oftast inom ett år efter skörd, snarare än att lagras.",
        "Regionen är i själva verket uppdelad i nio underregioner, var och en med sin egen druvprofil. Monção e Melgaço i norr är hemvist för de bästa Alvarinho-vinerna, medan Loureiro dominerar mer centralt. Många av vinerna är blandningar av flera druvor, vilket ger den karaktäristiska kombinationen av citrus, grön frukt och en lätt, ibland knappt märkbar pärlning.",
        "Länge sågs Vinho Verde som ett enkelt sommarvin, men en ny generation producenter — inklusive de vi jobbar med — tar druvorna på större allvar: lägre skördar, enskilda druvsorter och mer omsorgsfull vinifiering. Resultatet är viner som fortfarande är friska och lätta, men med betydligt mer djup än ryktet antyder."],
      en: ["Vinho Verde is the name of both a region and its wine, in the damp, green northwestern corner of Portugal between the Minho and Douro rivers. The name doesn't refer to colour but to the wine's youth — it's meant to be drunk young and fresh, usually within a year of harvest rather than aged.",
        "The region is actually divided into nine sub-regions, each with its own grape profile. Monção e Melgaço in the north is home to the finest Alvarinho wines, while Loureiro dominates further inland. Many of the wines are blends of several grapes, giving the characteristic combination of citrus, green fruit and a light, sometimes barely noticeable spritz.",
        "For a long time Vinho Verde was seen as a simple summer wine, but a new generation of producers — including the ones we work with — are taking the grapes more seriously: lower yields, single varietals, and more careful winemaking. The result is wines that remain fresh and light, but with far more depth than the reputation suggests."],
      pt: ["Vinho Verde é o nome de uma região e do seu vinho, no húmido e verde canto noroeste de Portugal, entre os rios Minho e Douro. O nome não se refere à cor, mas à juventude do vinho — feito para ser bebido jovem e fresco, normalmente até um ano após a colheita, em vez de envelhecido.",
        "A região está, na verdade, dividida em nove sub-regiões, cada uma com o seu perfil de castas. Monção e Melgaço, a norte, é o lar dos melhores Alvarinhos, enquanto a Loureiro domina mais para o interior. Muitos dos vinhos são lotes de várias castas, o que dá a combinação característica de citrinos, fruta verde e uma leve, por vezes quase impercetível, agulha.",
        "Durante muito tempo o Vinho Verde foi visto como um vinho de verão simples, mas uma nova geração de produtores — incluindo aqueles com quem trabalhamos — leva as castas mais a sério: rendimentos mais baixos, castas isoladas e uma vinificação mais cuidada. O resultado são vinhos que continuam frescos e leves, mas com muito mais profundidade do que a fama sugere."],
    } },

/* ===========================================================
   STATE & HELPERS
=========================================================== */

const AGE_GATE_KEY = "rv_age_verified";

function getStoredAgeVerified() {
  try {
    return sessionStorage.getItem(AGE_GATE_KEY) === "true";
  } catch (e) {
    return false;
  }
}

function setStoredAgeVerified() {
  try {
    sessionStorage.setItem(AGE_GATE_KEY, "true");
  } catch (e) {
    /* sessionStorage unavailable — falls back to per-page-load check */
  }
}

const state = {
  lang: "sv",
  view: (typeof INITIAL_VIEW !== "undefined" ? INITIAL_VIEW : "hem"),
  articleId: null,
  ageVerified: getStoredAgeVerified(),
};

function esc(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ===========================================================
   SIGNATURE ELEMENT — the growing vine line (pure CSS animation)
=========================================================== */

function vineLine(width = 220, extraClass = "") {
  return `
    <svg class="rv-vine ${extraClass}" width="${width}" height="20" viewBox="0 0 220 20" fill="none">
      <path class="rv-vine-path" d="M2 10 C 30 -2, 45 22, 72 10 S 120 -2, 148 10 S 195 22, 218 10" stroke="#F97425" stroke-width="1.3" stroke-linecap="round" />
      <circle class="rv-vine-dot" cx="35" cy="4" r="2" fill="#3F4A3A" style="animation-delay:.8s" />
      <circle class="rv-vine-dot" cx="110" cy="18" r="2" fill="#3F4A3A" style="animation-delay:1s" />
      <circle class="rv-vine-dot" cx="182" cy="4" r="2" fill="#3F4A3A" style="animation-delay:1.2s" />
    </svg>`;
}

/* ===========================================================
   VIEWS
=========================================================== */

function renderNav() {
  const t = T[state.lang];
  const items = [
    ["hem", t.nav.hem],
    ["produkter", t.nav.produkter],
    ["artiklar", t.nav.artiklar],
    ["om", t.nav.om],
  ];
  const navLinks = items.map(([key, label]) => {
    const active = state.view === key || (state.view === "artikel" && key === "artiklar");
    return `<button class="rv-nav-link ${active ? "active" : ""}" data-nav="${key}">${esc(label)}</button>`;
  }).join("");
  const langBtns = LANGS.map(l => `<button class="rv-lang-btn ${state.lang === l.code ? "active" : ""}" data-lang="${l.code}">${l.label}</button>`).join("");
  return `
    <header class="rv-nav">
      <div class="rv-lang-switch">${langBtns}</div>
      <button class="rv-brand" data-nav="hem">
        <img src="${LOGO_SRC}" alt="PortoFolioWines" class="rv-logo-img big">
      </button>
      <div class="rv-nav-bottom">
        <nav class="rv-nav-links">${navLinks}</nav>
      </div>
    </header>`;
}

function renderFooter() {
  const t = T[state.lang];
  return `
    <footer class="rv-footer">
      <div><img src="${LOGO_SRC}" alt="PortoFolioWines" class="rv-logo-img small"></div>
      <div class="rv-footer-contact">
        <span>Mailbox 1414, 411 42 Göteborg</span>
        <span>+46 (0)737 058938</span>
        <span>david@portofoliowines.se</span>
      </div>
      <p class="rv-footer-note">${esc(t.footer.note)}</p>
    </footer>`;
}

function renderArticleCard(a) {

    <button class="rv-article-card" data-article="${a.id}">

        <span class="rv-article-time">${a.readTime}${esc(t.artiklar.readSuffix)}</span>

}

function renderArtiklar() {
  const t = T[state.lang];
  return `

      <h1 class="rv-h1">${esc(t.artiklar.title)}</h1>
      ${vineLine(160)}

    <div class="rv-grid articles">${ARTICLES.map(renderArticleCard).join("")}</div>`;
}

function renderArtikelDetalj() {
  const t = T[state.lang];

    <div class="rv-article-detail">
      <button class="rv-back" data-nav="artiklar">${esc(t.artiklar.back)}</button>

function renderAgeGate() {
  const t = T[state.lang];
  const langBtns = LANGS.map(l => `<button class="rv-lang-btn ${state.lang === l.code ? "active" : ""}" data-lang="${l.code}">${l.label}</button>`).join("");
  return `
    <div class="rv-gate">
      <div class="rv-gate-card">
        <div class="rv-gate-lang">${langBtns}</div>
        <div class="rv-brand" style="justify-content:center;margin-bottom:1.2rem;">
          <img src="${LOGO_SRC}" alt="PortoFolioWines" class="rv-logo-img large">
        </div>
        <h1 class="rv-h2" style="margin-top:.6rem;">${esc(t.gate.title)}</h1>
        <p class="rv-body small" style="margin:.6rem auto 1.8rem;max-width:36ch;">${esc(t.gate.body)}</p>
        <div class="rv-gate-actions">
          <button class="rv-btn primary" data-age-confirm>${esc(t.gate.yes)}</button>
          <button class="rv-btn ghost" data-age-decline>${esc(t.gate.no)}</button>
        </div>
      </div>
    </div>`;
}

/* ===========================================================
   MAIN RENDER
=========================================================== */

function render() {
  const app = document.getElementById("app");
  if (!state.ageVerified) {
    app.innerHTML = renderAgeGate();
    return;
  }
  let body = "";
  if (state.view === "hem") body = renderHem();
  else if (state.view === "produkter") body = renderProdukter();
  else if (state.view === "artiklar") body = renderArtiklar();
  else if (state.view === "artikel") body = renderArtikelDetalj();
  else if (state.view === "om") body = renderOmOss();
  app.innerHTML = renderNav() + body + renderFooter();
}

document.getElementById("app").addEventListener("click", e => {
  const ageConfirm = e.target.closest("[data-age-confirm]");
  if (ageConfirm) {
    setStoredAgeVerified();
    state.ageVerified = true;
    render();
    return;
  }
  const ageDecline = e.target.closest("[data-age-decline]");
  if (ageDecline) {
    window.location.href = "https://www.google.com";
    return;
  }
  const langBtn = e.target.closest("[data-lang]");
  if (langBtn) {
    state.lang = langBtn.dataset.lang;
    render();
    return;
  }
  const articleBtn = e.target.closest("[data-article]");
  if (articleBtn) {
    state.view = "artikel";
    state.articleId = Number(articleBtn.dataset.article);
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const navBtn = e.target.closest("[data-nav]");
  if (navBtn) {
    state.view = navBtn.dataset.nav;
    state.articleId = null;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
});

render();

  </script>
